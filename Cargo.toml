[workspace]
resolver = "2"
members = ["crates/*", "ui/src-tauri"]

# Dependency rule (RULES.md §1.2): every workspace dep needs a one-line reason.

[workspace.package]
version = "0.2.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }   # document model + manifests are serde-borne
serde_json = "1"                                   # project files are JSON
thiserror = "2"                                    # typed errors per crate (RULES.md §2.6)
toml = "0.8"                                       # plugin manifests are TOML
glam = { version = "0.29", features = ["serde"] }  # math for engine

# Optimize bonaparte-engine during dev so software pixel rendering and math run at full speed
[profile.dev.package.bonaparte-engine]
opt-level = 3


[profile.dev.package.bonaparte-effects]
opt-level = 3

[profile.dev.package.fontdue]
opt-level = 3

[profile.dev.package.ttf-parser]
opt-level = 3
