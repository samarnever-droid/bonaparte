api_version = "1.0"
id = "builtin.transform"
name = "Transform Effect"
category = "Distort"
gpu_preview = true
cost = "light"
shader = "transform.wgsl"
inputs = ["input"]

[[params]]
id = "offset_x"
scale_with_resolution = true
name = "Offset X"
doc = "Horizontal translation in pixels."
kind = { Slider = { min = -1000.0, max = 1000.0, default = 0.0 } }

[[params]]
id = "offset_y"
scale_with_resolution = true
name = "Offset Y"
doc = "Vertical translation in pixels."
kind = { Slider = { min = -1000.0, max = 1000.0, default = 0.0 } }

[[params]]
id = "scale_x"
name = "Scale X"
doc = "Horizontal scale factor (1.0 = 100%)."
kind = { Slider = { min = 0.01, max = 10.0, default = 1.0 } }

[[params]]
id = "scale_y"
name = "Scale Y"
doc = "Vertical scale factor (1.0 = 100%)."
kind = { Slider = { min = 0.01, max = 10.0, default = 1.0 } }

[[params]]
id = "rotation"
name = "Rotation"
doc = "Rotation angle in degrees around center."
kind = { Slider = { min = -360.0, max = 360.0, default = 0.0 } }
