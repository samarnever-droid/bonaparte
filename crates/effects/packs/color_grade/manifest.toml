api_version = "1.0"
id = "builtin.color_grade"
name = "Color Grade"
category = "Color correction"
gpu_preview = true
cost = "light"
shader = "color_grade.wgsl"
inputs = ["input"]

[[params]]
id = "temperature"
name = "Temperature"
doc = "Relative warm/cool white balance; positive values warm the image."
group = "White balance"
step = 0.01
unit = ""
kind = { Slider = { min = -1.0, max = 1.0, default = 0.0 } }

[[params]]
id = "tint"
name = "Tint"
doc = "Relative green/magenta balance; positive values shift toward magenta."
group = "White balance"
step = 0.01
unit = ""
kind = { Slider = { min = -1.0, max = 1.0, default = 0.0 } }

[[params]]
id = "exposure"
name = "Exposure"
doc = "Exposure compensation in stops, applied in linear-light RGB."
group = "Light"
step = 0.05
unit = "EV"
kind = { Slider = { min = -5.0, max = 5.0, default = 0.0 } }

[[params]]
id = "contrast"
name = "Contrast"
doc = "Display-referred contrast around middle gray."
group = "Light"
step = 0.01
unit = ""
kind = { Slider = { min = 0.0, max = 2.0, default = 1.0 } }

[[params]]
id = "highlights"
name = "Highlights"
doc = "Recover or lift the upper tonal range."
group = "Light"
step = 0.01
unit = ""
kind = { Slider = { min = -1.0, max = 1.0, default = 0.0 } }

[[params]]
id = "shadows"
name = "Shadows"
doc = "Lift or deepen the lower tonal range."
group = "Light"
step = 0.01
unit = ""
kind = { Slider = { min = -1.0, max = 1.0, default = 0.0 } }

[[params]]
id = "whites"
name = "Whites"
doc = "Adjust the brightest values without shifting the midpoint."
group = "Light"
step = 0.01
unit = ""
kind = { Slider = { min = -1.0, max = 1.0, default = 0.0 } }

[[params]]
id = "blacks"
name = "Blacks"
doc = "Adjust the darkest values without shifting the midpoint."
group = "Light"
step = 0.01
unit = ""
kind = { Slider = { min = -1.0, max = 1.0, default = 0.0 } }

[[params]]
id = "lift"
name = "Lift"
doc = "Raise or crush everything after contrast; classic lift wheel."
group = "Light"
step = 0.005
unit = ""
kind = { Slider = { min = -0.25, max = 0.25, default = 0.0 } }

[[params]]
id = "gain"
name = "Gain"
doc = "Multiplicative linear-light gain on top of exposure."
group = "Light"
step = 0.01
unit = "×"
kind = { Slider = { min = 0.5, max = 1.5, default = 1.0 } }

[[params]]
id = "lift_color"
name = "Lift tint"
doc = "Chromatic lift wheel: pushes shadows toward this color. Center gray is neutral."
group = "Light"
kind = { Color = { default = [0.5, 0.5, 0.5, 1.0] } }

[[params]]
id = "gain_color"
name = "Gain tint"
doc = "Chromatic gain wheel: multiplies each channel in linear light, up to one stop from center gray."
group = "Light"
kind = { Color = { default = [0.5, 0.5, 0.5, 1.0] } }

[[params]]
id = "filmic"
name = "Filmic rolloff"
doc = "Blend toward an ACES-fitted tonemap so highlights roll off instead of clipping."
group = "Light"
step = 0.01
unit = ""
kind = { Slider = { min = 0.0, max = 1.0, default = 0.0 } }

[[params]]
id = "saturation"
name = "Saturation"
doc = "Luma-preserving saturation; zero produces a monochrome image."
group = "Color"
step = 0.01
unit = ""
kind = { Slider = { min = 0.0, max = 2.0, default = 1.0 } }

[[params]]
id = "vibrance"
name = "Vibrance"
doc = "Selectively adjust less-saturated colors."
group = "Color"
step = 0.01
unit = ""
kind = { Slider = { min = -1.0, max = 1.0, default = 0.0 } }

[[params]]
id = "gamma"
name = "Gamma"
doc = "Adjust midtones; values above one lighten the image."
group = "Color"
step = 0.01
unit = ""
kind = { Slider = { min = 0.1, max = 3.0, default = 1.0 } }

[[params]]
id = "fade"
name = "Fade"
doc = "Lift the black floor for a faded print look."
group = "Color"
step = 0.01
unit = ""
kind = { Slider = { min = 0.0, max = 1.0, default = 0.0 } }

[[params]]
id = "split_shadow_hue"
name = "Split shadow hue"
doc = "Hue tinted into the shadows by split strength, in degrees."
group = "Split toning"
step = 1.0
unit = "°"
kind = { Slider = { min = 0.0, max = 360.0, default = 220.0 } }

[[params]]
id = "split_highlight_hue"
name = "Split highlight hue"
doc = "Hue tinted into the highlights by split strength, in degrees."
group = "Split toning"
step = 1.0
unit = "°"
kind = { Slider = { min = 0.0, max = 360.0, default = 45.0 } }

[[params]]
id = "split_balance"
name = "Split balance"
doc = "Shifts the shadow/highlight crossover; negative protects highlights, positive protects shadows."
group = "Split toning"
step = 0.01
unit = ""
kind = { Slider = { min = -1.0, max = 1.0, default = 0.0 } }

[[params]]
id = "split_strength"
name = "Split strength"
doc = "How strongly the shadow/highlight hues tint the image; zero disables split toning."
group = "Split toning"
step = 0.01
unit = ""
kind = { Slider = { min = 0.0, max = 1.0, default = 0.0 } }
