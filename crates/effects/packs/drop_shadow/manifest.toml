api_version = "1.0"
id = "builtin.drop_shadow"
name = "Drop Shadow"
category = "Light & stylize"
gpu_preview = true
cost = "medium"
shader = "drop_shadow.wgsl"
inputs = ["input"]

[[params]]
id = "offset_x"
scale_with_resolution = true
name = "Offset X"
doc = "Horizontal shadow offset in pixels."
kind = { Slider = { min = -200.0, max = 200.0, default = 10.0 } }

[[params]]
id = "offset_y"
scale_with_resolution = true
name = "Offset Y"
doc = "Vertical shadow offset in pixels."
kind = { Slider = { min = -200.0, max = 200.0, default = 10.0 } }

[[params]]
id = "radius"
scale_with_resolution = true
name = "Radius"
doc = "Blur radius of the shadow in pixels."
kind = { Slider = { min = 0.0, max = 100.0, default = 15.0 } }

[[params]]
id = "color"
name = "Color"
doc = "Base color of the cast shadow."
kind = { Color = { default = [0.0, 0.0, 0.0, 0.75] } }

[[params]]
id = "opacity"
name = "Opacity"
doc = "Overall opacity multiplier for the shadow."
kind = { Slider = { min = 0.0, max = 1.0, default = 0.75 } }
