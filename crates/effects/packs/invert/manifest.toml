api_version = "1.0"
id = "builtin.invert"
name = "Invert"
cost = "light"
shader = "invert.wgsl"
inputs = ["input"]

[[params]]
id = "amount"
name = "Amount"
doc = "Inversion blend factor from 0.0 to 1.0."
kind = { Slider = { min = 0.0, max = 1.0, default = 1.0 } }

[[params]]
id = "invert_alpha"
name = "Invert Alpha"
doc = "Whether to invert the alpha transparency channel along with RGB."
kind = { Checkbox = { default = false } }
