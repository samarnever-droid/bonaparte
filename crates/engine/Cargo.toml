[package]
name = "bonaparte-engine"
version.workspace = true
edition.workspace = true

[dependencies]
bonaparte-model = { path = "../model" }
bonaparte-effects = { path = "../effects" } # public registry/evaluator contract, no private plugin hooks
fontdue = "0.9" # pure-Rust rasterization of the bundled, licensed typefaces
glam = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true } # graph + tiles serialize into preview state

# GPU backend is behind a feature so the pure core builds fast everywhere and
# CI can enforce wasm32 purity without pulling wgpu into the check.
# wgpu = { version = "24", optional = true }
# bytemuck = { version = "1", features = ["derive"], optional = true }
# encase = { version = "0.10", optional = true }

[features]
default = []
gpu = []
