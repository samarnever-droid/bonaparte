[package]
name = "bonaparte-engine"
version.workspace = true
edition.workspace = true

[dependencies]
bonaparte-model = { path = "../model" }
bonaparte-effects = { path = "../effects" } # public registry/evaluator contract, no private plugin hooks
fontdue = "0.9" # pure-Rust rasterization of the bundled, licensed typefaces
glam = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true } # graph + tiles serialize into preview state

# Native GPU execution lives in bonaparte-gpu. This crate stays target-independent.

[dev-dependencies]
serde_json = { workspace = true } # independent legacy/prepared-renderer parity fixtures
