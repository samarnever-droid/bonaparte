[package]
name = "bonaparte-app"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bonaparte-runtime = { path = "../../crates/runtime" }
tauri-plugin-dialog = "2" # native, user-authorized project open/save dialogs
tempfile = "3" # atomic project saves in the destination directory
bonaparte-model = { path = "../../crates/model" }
bonaparte-engine = { path = "../../crates/engine" }
bonaparte-effects = { path = "../../crates/effects" }
bonaparte-media = { path = "../../crates/media" }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
